# Salin file ini menjadi robot.config.ini (file itu TIDAK di-commit ke GitHub)
# cp robot.config.example.ini robot.config.ini

# IP controller robot Aubo (wajib)
robot_addr=192.168.x.x

robot_port=8899
com_hand=3
arduino_port=COM6
arduino_baud=9600
tcp_bridge_port=8765

# Token untuk bridge TCP (website Node.js). Buat string acak panjang.
# Contoh generate: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
api_token=GANTI_DENGAN_TOKEN_ACAK_PANJANG
